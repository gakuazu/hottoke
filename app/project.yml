name: HottokeApp
options:
  bundleIdPrefix: com.gakuazu.hottoke
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  HottokeApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HottokeApp
    info:
      path: HottokeApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: トキノワ
        NSMotionUsageDescription: "今日の活動データから、1日の活動を点で描いた「1日の輪」の画像を作るために使います。データは端末の外へは一切送信しません。"
        NSPhotoLibraryAddUsageDescription: "作成した「1日の輪」の画像をあなたの写真ライブラリに保存するために使います。"
        NSLocationWhenInUseUsageDescription: "その日いた場所から「ひとこと日記」の下書きを自動で作るために使います。大きく場所が変わったときだけ記録する省電力な方法を使い、常に細かく追跡することはありません。位置情報は端末の外へは一切送信されず、設定アプリの「トキノワ」またはアプリ内の設定画面からいつでもオフにできます。"
        NSPhotoLibraryUsageDescription: "その日撮った写真を「ひとこと日記」のそばに小さく表示するために使います。写真はその場で読み込むだけで、アプリの中にコピー・保存はしません。設定画面からいつでもオフにできます。"
        UIBackgroundModes:
          - location
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
    settings:
      base:
        # 【一時的な診断用】Sideloadlyの「Guru Meditation ... Invalid file」インストール失敗の
        # 切り分けのため、正規のcom.gakuazu.hottoke.appから一時的にこの値に変更している。
        # 診断が終わったらcom.gakuazu.hottoke.appに戻すこと（docs/04-build-log.mdへの追記はまだしない）。
        PRODUCT_BUNDLE_IDENTIFIER: com.gakuazu.hottoke.diag
        PRODUCT_NAME: HottokeApp
  HottokeAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HottokeAppTests
    dependencies:
      - target: HottokeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gakuazu.hottoke.apptests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HottokeApp:
    build:
      targets:
        HottokeApp: all
        HottokeAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HottokeAppTests
    archive:
      config: Release
